name: It does not fit my store
description: The suite cannot be adapted to a store by configuration alone
labels: ["adapting"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful report there is. The whole premise is that a store is
        adapted by data rather than by forking, so a store that cannot be is a
        hole in the premise.
  - type: textarea
    id: what
    attributes:
      label: What you could not express
      description: The behaviour your store has, and what you wanted the suite to assert about it.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: |
        Which of `config/{selectors,slugs,inputs,fixtures,features}.json` you
        reached for, and where it ran out. Paste the keys you overrode.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you did instead
      description: Subclassed a page object, forked, gave up, skipped the test. All useful to know.
  - type: input
    id: store
    attributes:
      label: Store shape
      description: Magento or Mage-OS version, theme, and anything unusual (multi-store, headless, a search engine that is not the default).
      placeholder: "Magento 2.4.8, Hyva 1.3, ElasticSuite"
