# Minimal Magento vhost. The image ships Magento's own nginx.conf.sample at
# /var/www/html/nginx.conf.sample, which does the real work; this only sets the
# root, the upstream and the two variables that sample expects.
upstream fastcgi_backend {
    server php:9000;
}

server {
    listen 80;
    server_name localhost;

    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE production;

    client_max_body_size 64M;

    include /var/www/html/nginx.conf.sample;
}
